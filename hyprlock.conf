$fontFamily = Maple Mono NL NF 

# Paleta NixOS (Azules Fríos y Cálidos)
$nix_blue_deep = rgba(13, 25, 48, 1.0)
$nix_blue_mid = rgba(39, 56, 102, 1.0)
$nix_blue_light = rgba(126, 186, 228, 1.0)
$nix_cyan = rgba(82, 187, 215, 1.0)
$nix_white = rgba(200, 220, 245, 1.0)

background {
    monitor =
    color = $nix_blue_deep
    path = $BACKGROUND_PATH # Te sugiero un wallpaper de NixOS tipo "Snowflake"
    blur_size = 5
    blur_passes = 3
    noise = 0.01
    contrast = 1.1
    brightness = 0.7
    vibrancy = 0.3
}

# DÍA (En mayúsculas con espacios, estilo Anurati)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A" | sed 's/./& /g' | tr '[:lower:]' '[:upper:]')"
    color = $nix_cyan
    font_size = 110
    font_family = Anurati
    position = 0, 100
    halign = center
    valign = center
}

# FECHA
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%B %d")"
    color = $nix_blue_light
    font_size = 35
    font_family = $fontFamily Thin
    position = 0, -20
    halign = center
    valign = center
}
# HORA
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M %p")"
    color = $nix_white
    font_size = 22
    font_family = $fontFamily Bold
    position = 0, 150
    halign = center
    valign = bottom
}

# INPUT FIELD (Caja de contraseña con colores Nix)
input-field {
    monitor =
    size = 250, 55
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    outer_color = $nix_blue_light
    inner_color = $nix_blue_mid
    font_color = $nix_white
    fade_on_empty = true
    placeholder_text = <span foreground="##7EBAE4"><i>Introduce la llave de Nix...</i></span>
    hide_input = false
    rounding = 15
    check_color = $nix_cyan
    fail_color = rgba(255, 85, 85, 1.0)
    fail_text = <i>Error ($ATTEMPTS)</i>
    position = 0, 80
    halign = center
    valign = bottom
}

# User tag con logo de NixOS (usando Nerd Font)
label {
    monitor =
    text =   $USER 
    color = $nix_cyan
    font_size = 20
    font_family = Inter Display Medium
    position = 0, 30
    halign = center
    valign = bottom
}

# Status de Batería
label {
    monitor =
    text = cmd[update:5000] echo "$BATTERY_ICON"
    color = $nix_blue_light
    font_size = 18
    font_family = $fontFamily
    position = -20, 20
    halign = right
    valign = bottom
}
